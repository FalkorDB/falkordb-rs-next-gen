# Test the synthetic-benchmark reporting toolchain on every PR that touches it:
#   - static checks: the interactive page template must stay free of HTML-string
#     injection sinks, and the committed data.json fixtures must match the schema
#     the page consumes (tests/synthetic-report/test_static.py);
#   - renderer checks: the sticky-comment renderer's three-verdict-line contract
#     (tests/synthetic-report/test_comment.py);
#   - DOM checks: Playwright/Chromium drives the real page against the fixtures —
#     XSS-shaped labels must render inert, selectors/chips/filters must work
#     (tests/synthetic-report/test_page_dom.py);
#   - the digest-normalization self-test built into synthetic-run.sh.
name: Synthetic report tests

on:
  pull_request:
    paths:
      - ".github/scripts/benchmark/synthetic-*"
      - ".github/scripts/benchmark/assemble-synthetic-data.py"
      - ".github/scripts/benchmark/render-synthetic-comment.py"
      - "tests/synthetic-report/**"
      - ".github/workflows/synthetic-report-tests.yml"

permissions:
  contents: read

jobs:
  synthetic-report-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/synthetic-report/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/synthetic-report/requirements.txt
      # Playwright downloads ~100 MB of Chromium; cache it keyed on the pinned
      # pytest-playwright version so re-runs are fast.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/synthetic-report/requirements.txt') }}
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Digest-normalization self-test (synthetic-run.sh)
        run: bash .github/scripts/benchmark/synthetic-run.sh --self-test
      - name: Run synthetic-report tests
        run: pytest tests/synthetic-report -v --browser chromium
