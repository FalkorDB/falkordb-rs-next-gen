# Per-query benchmark + query-set coverage, on demand, on a dedicated VM.
#
# Complements `benchmark.yml` without overlapping it: that one runs a macro
# throughput/latency A/B/C against published images. This one runs `bench/` —
# the per-query harness (316 queries) — building both `main` and the PR head
# from source, and reports per-query deltas plus how much of the `graph` crate
# the query set covers.
#
# Trigger: add the `benchmark-cov` label to a PR. Only on the `labeled` event,
# never on later pushes while the label happens to sit there — this creates a
# VM and builds the module twice, so it must be an explicit request. To re-run,
# remove and re-add the label. Fork PRs are skipped: their GITHUB_TOKEN is
# read-only and could not comment.
#
# ## Why a self-hosted VM rather than ubuntu-latest
#
# Instruction counts are the only stable signal at this granularity — cycles and
# wall-clock on a shared runner move 10-60% with co-tenancy, enough to invent
# regressions that do not exist. Per-process instruction counts need the PMU,
# which needs (a) `kernel.perf_event_paranoid <= 0` and (b) a host that actually
# exposes counters. A GitHub-hosted runner gives neither. An ephemeral GCE VM
# runs as root, so this job sets the sysctl itself and runs the toolchain image
# `--privileged`.
#
# ## The one prerequisite outside this workflow
#
# GCE exposes hardware counters only when the instance is created with
# `--performance-monitoring-unit` — an instance-creation flag that cannot be
# changed on a running VM. This workflow requests `ARCHITECTURAL`, and
# `.github/actions/create-runner` now forwards it to the SHA-pinned
# `FalkorDB/gce-github-runner` it wraps.
#
# If that pinned action does not accept the input yet, Actions logs an
# "Unexpected input" warning, ignores it, and the VM comes up without counters.
# That is why the `Preflight — PMU availability` step probes rather than
# assumes: it loosens `kernel.perf_event_paranoid`, installs `perf`, checks
# whether counters actually read, and annotates the run if not. The job then
# continues and reports what it can trust.
#
# It never substitutes wall-clock for instructions. A time-based stand-in would
# turn the gate into a noise detector while still looking like a measurement,
# which is worse than reporting the metric as absent.
name: Benchmark + coverage

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-cov-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUNNER_LABEL: benchcov-${{ github.run_id }}-${{ github.run_number }}

jobs:
  create-runner:
    if: >-
      github.event.label.name == 'benchmark-cov' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Acknowledge the request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X POST "repos/$REPO/issues/$PR/reactions" -f content="eyes" || true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Create GCE runner
        uses: ./.github/actions/create-runner # gce-github-runner + retry on stockout
        with:
          token: ${{ secrets.GH_SA_TOKEN }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          machine_zones: ${{ vars.GCP_ZONES }}
          machine_type: ${{ vars.BENCHMARK_MACHINE_TYPE || 'n4-highcpu-16' }}
          network: gh-runner
          runner_label: benchcov-${{ github.run_id }}-${{ github.run_number }}
          # Instruction counts need the GCE virtual PMU, which is settable only
          # at instance creation. Forwarded to the pinned gce-github-runner
          # fork; if that action does not accept the input yet, Actions warns
          # and ignores it and the job degrades to allocated-bytes reporting.
          performance_monitoring_unit: ARCHITECTURAL

  benchmark-cov:
    needs: create-runner
    runs-on: benchcov-${{ github.run_id }}-${{ github.run_number }}
    timeout-minutes: 180
    # The toolchain image already carries GraphBLAS/RediSearch, so both sides
    # build in minutes instead of compiling native deps from scratch.
    # --privileged so the PMU and /proc/sys are reachable; the VM is ephemeral
    # and single-tenant, so this is contained.
    container:
      image: ghcr.io/falkordb/falkordb-build:latest
      options: --privileged
    steps:
      - name: Preflight — PMU availability
        id: pmu
        run: |
          set -x
          # Loosen the sysctl first: on a root-owned ephemeral VM this is ours
          # to set, and it is the usual reason perf reports nothing.
          sysctl -w kernel.perf_event_paranoid=-1 || \
            echo "could not set perf_event_paranoid (continuing; may already be permissive)"
          cat /proc/sys/kernel/perf_event_paranoid || true

          command -v perf || {
            apt-get update -qq
            # linux-perf matches Debian; fall back to the generic tools package.
            apt-get install -y -qq linux-perf || apt-get install -y -qq linux-tools-generic || true
          }

          if perf stat -x, -e instructions,cycles -- true 2>&1 | grep -qE '^[0-9]+,+(instructions|cycles)'; then
            echo "pmu=yes" >> "$GITHUB_OUTPUT"
            echo "PMU counters available — instructions/cycles will be measured."
          else
            echo "pmu=no" >> "$GITHUB_OUTPUT"
            echo "::warning::PMU counters unavailable on this VM. The run requested --performance-monitoring-unit=ARCHITECTURAL via .github/actions/create-runner; check the create-runner step log for an 'Unexpected input' warning, which means the pinned FalkorDB/gce-github-runner does not accept it yet. The run continues and reports allocated bytes (deterministic) plus coverage; instructions/cycles are left empty rather than substituted."
          fi

      # Two checkouts so each build keeps its own target/ dir — rebuilding one
      # directory across refs serialises on cargo's lock for no benefit.
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: pr
          persist-credentials: false

      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: Install harness deps
        run: |
          python3 -m pip install --quiet --break-system-packages redis \
            || python3 -m pip install --quiet redis
          command -v redis-server || { apt-get update -qq && apt-get install -y -qq redis-server redis-tools; }
          command -v redis-benchmark
          redis-server --version

      - name: Build main module
        working-directory: base
        run: CXX=clang++ cargo build --release

      - name: Build PR module
        working-directory: pr
        run: CXX=clang++ cargo build --release

      # Sequentially, never in parallel: both bind a redis port and contend for
      # the same CPUs. Overlapping them yields numbers that look like
      # measurements but are not.
      - name: Measure main
        working-directory: pr
        run: |
          python3 bench/run_bench.py \
            --module "$GITHUB_WORKSPACE/base/target/release/libfalkordb.so" \
            --out /tmp/main.csv

      - name: Measure PR
        working-directory: pr
        run: |
          python3 bench/run_bench.py \
            --module "$GITHUB_WORKSPACE/pr/target/release/libfalkordb.so" \
            --out /tmp/pr.csv

      - name: Compare PR vs main
        working-directory: pr
        run: |
          # compare.py exits non-zero on a regression. This job reports rather
          # than gates, so record the status instead of failing the run.
          set +e
          python3 bench/compare.py /tmp/pr.csv /tmp/main.csv > /tmp/compare.txt 2>&1
          echo "compare_exit=$?" >> "$GITHUB_ENV"
          set -e
          tail -40 /tmp/compare.txt

      - name: Coverage of the query set
        working-directory: pr
        run: |
          set +e
          bash bench/coverage.sh > /tmp/coverage.txt 2>&1
          echo "coverage_exit=$?" >> "$GITHUB_ENV"
          set -e
          tail -30 /tmp/coverage.txt

      - name: Build the comment
        working-directory: pr
        env:
          PMU: ${{ steps.pmu.outputs.pmu }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import csv, os

          def read(path):
              try:
                  with open(path) as f:
                      return {r["query"]: r for r in csv.DictReader(f)}
              except OSError:
                  return {}

          pr, main = read("/tmp/pr.csv"), read("/tmp/main.csv")

          def num(row, key):
              try:
                  return float(row[key])
              except (KeyError, TypeError, ValueError):
                  return None

          # Rank by instructions when the PMU delivered them (deterministic),
          # else by allocated bytes (also deterministic). Never by wall-clock:
          # on any shared or virtualised host that ranks noise.
          have_instr = any(num(r, "instr") is not None for r in pr.values())
          metric = "instr" if have_instr else "alloc_bytes"

          rows = []
          for q, p in pr.items():
              m = main.get(q)
              if not m:
                  continue
              a, b = num(m, metric), num(p, metric)
              if a is None or b is None or a <= 0:
                  continue
              rows.append((b / a, q, a, b))
          rows.sort()

          print("## Benchmark + coverage")
          print()
          print("316-query harness; both sides built from source in this run on a "
                "dedicated ephemeral GCE VM.")
          print()
          if have_instr:
              print(f"Ranked by **instructions** (deterministic). Cycles are also "
                    f"recorded but move with the host; wall-clock `ms` is advisory only.")
          else:
              print("> **Instructions and cycles are unavailable on this VM.** GCE exposes "
                    "the PMU only when the instance is created with "
                    "`--performance-monitoring-unit=ARCHITECTURAL`, and "
                    "`.github/actions/create-runner` pins a third-party action whose "
                    "inputs do not pass that through. Those columns are left **empty** "
                    "rather than filled with a wall-clock substitute, which would turn "
                    "the gate into a noise detector.")
              print(">")
              print("> Ranked by **allocated bytes** instead — jemalloc merged-arena "
                    "deltas, which are deterministic and have repeatedly been the "
                    "clearest signal here (a CASE row moving 8,722 → 1,989 B/query when "
                    "its per-row branch list was removed).")
          print()

          if not rows:
              print("No comparable rows — see the workflow log.")
          else:
              def table(title, subset):
                  print(f"### {title}")
                  print()
                  print("| query | main | PR | ratio |")
                  print("|---|---|---|---|")
                  for r, q, a, b in subset:
                      print(f"| {q} | {a:,.0f} | {b:,.0f} | {r:.2f}x |")
                  print()

              improved = [r for r in rows if r[0] < 0.95][:15]
              regressed = [r for r in reversed(rows) if r[0] > 1.05][:15]
              if improved:
                  table(f"Improved ({len(improved)} shown)", improved)
              if regressed:
                  table(f"Regressed ({len(regressed)} shown)", regressed)
              if not improved and not regressed:
                  print("No row moved more than 5% either way.")
                  print()

              geo = 1.0
              for r, *_ in rows:
                  geo *= r
              geo **= 1.0 / len(rows)
              print(f"**{len(rows)} rows compared, {metric} geomean {geo:.3f}.**")
              print()
              print("Micro-queries near the fixed per-query floor need 3 reps per build "
                    "before a small delta means anything — re-measure a flagged row in "
                    "isolation before acting on it.")
              print()

          for title, path in (("Full compare.py output", "/tmp/compare.txt"),
                              ("Query-set coverage of the graph crate", "/tmp/coverage.txt")):
              print(f"<details><summary>{title}</summary>")
              print()
              print("```")
              print(open(path).read()[-6000:] if os.path.exists(path) else "(missing)")
              print("```")
              print()
              print("</details>")
              print()
          PY
          cat /tmp/comment.md

      # Upsert, so re-running replaces the previous report instead of burying
      # the PR in near-identical comments.
      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER="<!-- benchmark-cov-report -->"
          printf '%s\n' "$MARKER" >> /tmp/comment.md
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq "map(select(.body | contains(\"$MARKER\"))) | .[-1].id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@/tmp/comment.md
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@/tmp/comment.md
          fi

  # The create-runner action's 6h auto-delete is the backstop; this no-ops on a
  # missing VM. `always()` so a failed or cancelled benchmark still tears down.
  cleanup-runner:
    needs: [create-runner, benchmark-cov]
    if: ${{ always() && needs.create-runner.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/cleanup-runner
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          instance_label: benchcov-${{ github.run_id }}-${{ github.run_number }}
