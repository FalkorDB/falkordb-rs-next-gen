# Pinned workload for the per-PR **synthetic** benchmark check. `FalkorDB/benchmark synthetic
# record --config <this file> --op all` reads `seed` / `graph` / `nodes` / `edges` to build the
# offline recording (its `workload_hash` must be identical for every image compared, which it is
# since all images replay this one recorded bundle).
#
# The measurement knobs (samples / warm-up / the concurrency sweep + cache modes) are pinned in the
# run script (.github/scripts/benchmark/synthetic-run.sh — the SAMPLES / WARMUP / SWEEP vars plus a
# hard-coded `--cache both`), which passes them to `run --recording` (which can't also take
# `--config`); they are repeated here only as documentation of the intended run:
#
#   samples     = 200
#   warmup      = 50
#   concurrency = [1, 2, 4, 8, 16, 32]
#   cache       = both
#
# The values below — seed / graph / nodes / edges — DEFINE the recorded workload: changing any of
# them changes `workload_hash`, so reports become incomparable with older ones. The measurement
# knobs above (samples / warm-up / concurrency / cache) do NOT change the recorded workload, but
# they change the measurement protocol, so altering them also breaks comparability with older
# reports. Bump either deliberately.

seed  = 7
graph = "synthetic_regression"
nodes = 10000
edges = 50000
